# Rapa / Recreate UI — Docker Compose
#
# Default stack: the app with an embedded SQLite database on a named volume.
# This matches server/prisma/schema.prisma (provider = "sqlite"), so
# `docker compose up` works out of the box with no external database.
#
# APP_SECRET is REQUIRED — there is no insecure fallback. Generate one:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
# and export it (or put it in a .env file next to this compose file) before
# `docker compose up`.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
      # Relative SQLite path resolves against server/prisma/, which is where
      # the `rapa_db_data` volume is mounted below.
      - DATABASE_URL=file:./data/production.db
      - 'APP_SECRET=${APP_SECRET:?APP_SECRET must be set — generate one with node crypto.randomBytes(32), see the comment at the top of this file}'
      - HOST=0.0.0.0
    volumes:
      - rapa_db_data:/app/server/prisma/data
    restart: unless-stopped

  # ── Optional: hosted MySQL for multi-user deployments ────────────────
  # Prisma's `provider` is a literal in schema.prisma and cannot be switched
  # by environment variable. To use MySQL:
  #   1. Change `provider = "sqlite"` to `provider = "mysql"` in
  #      server/prisma/schema.prisma.
  #   2. Uncomment the db service below.
  #   3. Set DATABASE_URL=mysql://root:rootpassword@db:3306/recreate_ui
  #      in the app environment above.
  #   4. Rebuild: docker compose up --build
  #
  # db:
  #   image: mysql:8.0
  #   ports:
  #     - "3306:3306"
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=rootpassword
  #     - MYSQL_DATABASE=recreate_ui
  #   volumes:
  #     - db_data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

volumes:
  rapa_db_data:
  # db_data:
